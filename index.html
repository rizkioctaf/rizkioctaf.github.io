<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monochrome Cam & Geo-Timestamp</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #121212;
            --surface-border: #262626;
            --text-main: #ffffff;
            --text-muted: #888888;
            --danger: #ff3b30;
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 4px;
        }

        h1 {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-muted);
            border-radius: 50%;
            transition: var(--transition);
        }

        .status-dot.active {
            background-color: var(--danger);
            box-shadow: 0 0 10px var(--danger);
            animation: pulse 1.5s infinite;
        }

        /* Viewfinder Container */
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
            justify-content: center;
        }

        .viewfinder {
            position: relative;
            width: 100%;
            aspect-ratio: 9/16;
            max-height: 62vh;
            background-color: var(--surface-color);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--surface-border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            transition: var(--transition);
        }

        @media (min-width: 768px) {
            .viewfinder {
                aspect-ratio: 4/3;
                max-height: 52vh;
            }
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Live Geo-Timestamp Overlay */
        #live-timestamp {
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.68rem;
            font-family: monospace;
            border: 1px solid rgba(255, 255, 255, 0.12);
            pointer-events: none;
            letter-spacing: 0.03em;
            line-height: 1.4;
        }

        /* Controls Area */
        .controls {
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 100%;
            padding: 10px 0;
        }

        button {
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:active {
            transform: scale(0.92);
        }

        .btn-capture {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background-color: transparent;
            border: 3px solid var(--text-main);
            position: relative;
        }

        .btn-capture::after {
            content: '';
            width: 58px;
            height: 58px;
            background-color: var(--text-main);
            border-radius: 50%;
            transition: var(--transition);
        }

        .btn-capture:hover::after {
            background-color: var(--text-muted);
        }

        .btn-record, .btn-switch {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--surface-color);
            border: 1px solid var(--surface-border);
            color: var(--text-main);
            font-size: 1.1rem;
        }

        .btn-record.recording {
            background-color: var(--danger);
            border-color: var(--danger);
            animation: pulse-border 1.5s infinite;
        }

        .btn-switch:hover, .btn-record:hover {
            background-color: #1a1a1a;
            border-color: #444;
        }

        /* Gallery Section */
        .gallery-section {
            width: 100%;
            max-width: 480px;
            margin-top: 10px;
        }

        .gallery-header {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 400;
        }

        .preview-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }

        .preview-list::-webkit-scrollbar {
            display: none;
        }

        .preview-item {
            flex: 0 0 64px;
            height: 64px;
            border-radius: 10px;
            overflow: hidden;
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            position: relative;
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .preview-item img, .preview-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-item a {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: var(--transition);
            color: white;
            text-decoration: none;
            font-size: 0.7rem;
        }

        .preview-item:hover a {
            opacity: 1;
        }

        canvas#hidden-canvas {
            display: none;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>GEO-MONOCHROME</h1>
        <div id="status-dot" class="status-dot"></div>
    </header>

    <div class="container">
        <div class="viewfinder">
            <video id="video" autoplay playsinline muted></video>
            <!-- Timestamp + Koordinat + Alamat -->
            <div id="live-timestamp">Memuat lokasi & waktu...</div>
        </div>

        <div class="controls">
            <button id="btn-switch" class="btn-switch" title="Ganti Kamera">🔄</button>
            <button id="btn-capture" class="btn-capture" title="Ambil Foto"></button>
            <button id="btn-record" class="btn-record" title="Rekam Video">⏺</button>
        </div>
    </div>

    <div class="gallery-section">
        <div class="gallery-header">HASIL MEDIA</div>
        <div class="preview-list" id="preview-list"></div>
    </div>

    <canvas id="hidden-canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('hidden-canvas');
        const liveTimestamp = document.getElementById('live-timestamp');
        const btnCapture = document.getElementById('btn-capture');
        const btnRecord = document.getElementById('btn-record');
        const btnSwitch = document.getElementById('btn-switch');
        const previewList = document.getElementById('preview-list');
        const statusDot = document.getElementById('status-dot');

        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let useFrontCamera = false;
        let isRecording = false;

        // Data Lokasi Global
        let currentLocationData = {
            lat: null,
            lon: null,
            address: "Mencari lokasi GPS..."
        };

        // 1. Ambil Koordinat GPS & Reverse Geocoding (Alamat)
        function initLocationTracking() {
            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        currentLocationData.lat = lat.toFixed(6);
                        currentLocationData.lon = lon.toFixed(6);

                        try {
                            // Menggunakan API Nominatim OpenStreetMap (Gratis & Tanpa Key)
                            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`, {
                                headers: { 'Accept-Language': 'id' }
                            });
                            const data = await response.json();
                            if (data && data.display_name) {
                                // Ambil bagian penting alamat agar tidak terlalu panjang di layar
                                const addr = data.address;
                                const road = addr.road || addr.suburb || addr.village || '';
                                const city = addr.city || addr.town || addr.county || '';
                                currentLocationData.address = `${road ? road + ', ' : ''}${city}`;
                            } else {
                                currentLocationData.address = "Alamat tidak ditemukan";
                            }
                        } catch (e) {
                            currentLocationData.address = `Lat: ${currentLocationData.lat}, Lon: ${currentLocationData.lon}`;
                        }
                    },
                    (error) => {
                        currentLocationData.address = "GPS Dinonaktifkan / Gagal";
                    },
                    { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
                );
            } else {
                currentLocationData.address = "GPS tidak didukung browser";
            }
        }

        // 2. Format Timestamp Detail + Koordinat + Alamat
        function getFullTimestampData() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('id-ID', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            const latLonStr = (currentLocationData.lat && currentLocationData.lon) 
                ? `${currentLocationData.lat}, ${currentLocationData.lon}` 
                : 'Mencari GPS...';

            const addressStr = currentLocationData.address;

            return {
                display: `📅 ${dateStr} | ⏰ ${timeStr}<br>📍 ${latLonStr}<br>🏠 ${addressStr}`,
                lines: [
                    `${dateStr} - ${timeStr}`,
                    `GPS: ${latLonStr}`,
                    `Loc: ${addressStr}`
                ]
            };
        }

        setInterval(() => {
            liveTimestamp.innerHTML = getFullTimestampData().display;
        }, 1000);

        // 3. Inisialisasi Kamera
        async function initCamera(useFront = false) {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: useFront ? 'user' : 'environment',
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                },
                audio: true
            };

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = mediaStream;
            } catch (error) {
                alert('Akses kamera/mikrofon ditolak.');
            }
        }

        // 4. Tangkap Foto & Burn-in Multi-baris Teks ke Canvas
        btnCapture.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const stampData = getFullTimestampData().lines;
            
            ctx.font = 'bold 24px monospace';
            
            // Cari lebar teks terpanjang untuk menyesuaikan kotak background
            let maxWidth = 0;
            stampData.forEach(line => {
                const w = ctx.measureText(line).width;
                if (w > maxWidth) maxWidth = w;
            });

            const paddingX = 24;
            const paddingY = 20;
            const lineHeight = 34;
            const boxHeight = (stampData.length * lineHeight) + (paddingY * 2);
            const boxWidth = maxWidth + (paddingX * 2);
            
            const x = 40;
            const y = canvas.height - boxHeight - 40;

            // Background Kapsul/Kotak Transparan Multi-baris
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.beginPath();
            ctx.roundRect(x, y, boxWidth, boxHeight, 20);
            ctx.fill();

            // Render Teks Baris per Baris ke Foto
            ctx.fillStyle = '#ffffff';
            stampData.forEach((line, index) => {
                ctx.fillText(line, x + paddingX, y + paddingY + (index * lineHeight) + 18);
            });

            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            addPreviewItem(dataUrl, 'image');
        });

        // 5. Rekaman Video
        btnRecord.addEventListener('click', () => {
            if (!isRecording) {
                recordedChunks = [];
                try {
                    mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm; codecs=vp9' });
                } catch (e) {
                    try {
                        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm' });
                    } catch (err) {
                        mediaRecorder = new MediaRecorder(mediaStream);
                    }
                }

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const videoUrl = URL.createObjectURL(blob);
                    addPreviewItem(videoUrl, 'video');
                };

                mediaRecorder.start();
                isRecording = true;
                btnRecord.classList.add('recording');
                btnRecord.textContent = "◼";
                statusDot.classList.add('active');
                btnSwitch.style.opacity = '0.3';
                btnSwitch.style.pointerEvents = 'none';
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btnRecord.classList.remove('recording');
                btnRecord.textContent = "⏺";
                statusDot.classList.remove('active');
                btnSwitch.style.opacity = '1';
                btnSwitch.style.pointerEvents = 'auto';
            }
        });

        // 6. Ganti Kamera
        btnSwitch.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            initCamera(useFrontCamera);
        });

        function addPreviewItem(url, type) {
            const item = document.createElement('div');
            item.className = 'preview-item';

            let mediaElement;
            if (type === 'image') {
                mediaElement = document.createElement('img');
                mediaElement.src = url;
            } else {
                mediaElement = document.createElement('video');
                mediaElement.src = url;
            }

            const downloadLink = document.createElement('a');
            downloadLink.href = url;
            downloadLink.download = `geo_cam_${Date.now()}.${type === 'image' ? 'jpg' : 'webm'}`;
            downloadLink.textContent = 'Unduh';

            item.appendChild(mediaElement);
            item.appendChild(downloadLink);
            previewList.prepend(item);
        }

        // Jalankan pelacakan lokasi dan kamera saat dimuat
        initLocationTracking();
        initCamera(useFrontCamera);
    </script>
</body>
</html>
