<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Optimasi Mobile: Mencegah zoom (pinch) agar terasa seperti aplikasi native -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - Halaman Tidak Ditemukan</title>
    <style>
        /* Reset & Native App Feel */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Hilangkan efek biru saat tap di mobile */
        }

        body {
            margin: 0;
            padding: 0;
            /* Gunakan dvh (dynamic viewport height) agar responsif dengan address bar mobile */
            height: 100dvh; 
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa; /* Light & bersih */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Cegah scroll */
            
            /* Konfigurasi 3D & Anti-bug touch */
            perspective: 1000px;
            touch-action: none; /* Cegah pull-to-refresh & scroll bawaan browser */
            user-select: none; /* Cegah teks ter-highlight tak sengaja */
        }

        /* Container 3D */
        .card-container {
            width: 85vw;
            max-width: 380px;
            padding: 50px 30px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.05),
                0 1px 3px rgba(0, 0, 0, 0.02);
            transform-style: preserve-3d;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.03);
            /* Transisi untuk scale saat di-tap/klik */
            transition: transform 0.1s; 
        }

        /* Elemen di dalam card yang melayang (TranslateZ) */
        .error-code {
            font-size: 6rem;
            font-weight: 900;
            margin: 0;
            color: #1a1a1a;
            letter-spacing: -2px;
            transform: translateZ(60px); /* Efek pop-up 3D paling tinggi */
            text-shadow: 0 15px 20px rgba(0, 0, 0, 0.1);
        }

        .error-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 15px 0 10px;
            color: #333;
            transform: translateZ(40px);
        }

        .error-desc {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 35px;
            line-height: 1.5;
            transform: translateZ(30px);
        }

        .btn-back {
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background-color: #1a1a1a;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transform: translateZ(45px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
            transition: background 0.3s, transform 0.2s;
        }

        .btn-back:active {
            background-color: #444;
            transform: translateZ(45px) scale(0.95); /* Feedback sentuhan native */
        }
    </style>
</head>
<body>

    <div class="card-container" id="card">
        <h1 class="error-code">404</h1>
        <div class="error-text">Halaman Tidak Ditemukan</div>
        <div class="error-desc">Maaf, halaman yang Anda cari mungkin telah dipindahkan atau sudah tidak tersedia.</div>
        <button class="btn-back" onclick="location.reload()">Kembali</button>
    </div>

    <script>
        const card = document.getElementById('card');
        
        // Target rotasi dari sentuhan/mouse
        let targetX = 0;
        let targetY = 0;
        
        // Posisi rotasi saat ini (untuk efek smooth/Lerp)
        let currentX = 0;
        let currentY = 0;
        
        // Sensitivitas pergerakan 3D
        const maxRotation = 25; // Maksimal rotasi dalam derajat

        // Fungsi membaca input mouse / layar sentuh
        const handleMove = (e) => {
            // Deteksi apakah ini event touch (mobile) atau mouse (desktop)
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            // Hitung persentase posisi kursor/jari dari tengah layar
            const percentX = (clientX - centerX) / centerX;
            const percentY = (clientY - centerY) / centerY;

            // Tentukan target rotasi (Y dibalik agar pergerakan terasa natural)
            targetY = percentX * maxRotation;
            targetX = -(percentY * maxRotation);
        };

        // Event Listener Mouse
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseleave', () => {
            targetX = 0; targetY = 0;
        });

        // Event Listener Touch (Mobile)
        window.addEventListener('touchmove', (e) => {
            // e.preventDefault() memblokir fungsi scroll native iOS/Android
            // sehingga aplikasi solid seperti app native
            e.preventDefault(); 
            handleMove(e);
        }, { passive: false });
        
        window.addEventListener('touchend', () => {
            // Kembalikan ke tengah saat jari dilepas
            targetX = 0; targetY = 0;
        });

        // Loop Animasi 60FPS dengan Linear Interpolation (Lerp)
        const animate = () => {
            // Lerp logic: Memindahkan nilai saat ini mendekati target sebesar 10% setiap frame
            // Menghasilkan pergerakan yang sangat mulus tanpa delay CSS
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;

            // Aplikasikan transformasi rotasi
            card.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;

            requestAnimationFrame(animate);
        };

        // Jalankan animasi
        animate();
    </script>
</body>
</html>
