<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebCLI Arsip</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --text-muted: #737373;
            --border-color: #e5e5e5;
            --accent-color: #000000;
            --error-color: #e11d48;
            --suggest-color: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
            font-size: 14px; 
            line-height: 1.5; 
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
        }

        #output-container {
            flex-grow: 1; overflow-y: auto; padding: 20px; scroll-behavior: smooth;
            display: flex; flex-direction: column; align-items: flex-start;
        }

        .line {
            opacity: 0; transform: translateY(8px); animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            margin-bottom: 6px; width: 100%; word-wrap: break-word;
        }
        .line.command-echo { color: var(--text-muted); margin-top: 14px; border-left: 2px solid var(--border-color); padding-left: 10px; }
        .line.error { color: var(--error-color); }
        .line.suggestion { color: var(--suggest-color); font-style: italic; }
        
        .archive-item {
            display: flex; gap: 15px; padding: 6px 12px; background: #f9f9f9; border-radius: 6px; margin-bottom: 4px; width: 100%; max-width: 600px;
        }
        .archive-id { font-weight: bold; min-width: 80px; }
        .archive-date { color: var(--text-muted); min-width: 90px; }
        .archive-title { flex-grow: 1; }

        /* Style untuk Isi Arsip */
        .archive-content {
            background: #fafafa; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-top: 5px;
            width: 100%; max-width: 700px; overflow-x: hidden;
        }
        
        .archive-content h3 { margin: 1em 0 0.5em; padding-bottom: 4px; border-bottom: 1px solid var(--border-color); font-size: 1.1em; color: var(--accent-color); }
        .archive-content p { margin-bottom: 4px; } 
        .archive-content ul { margin: 0 0 8px 20px; padding: 0; }
        .archive-content ul ul { margin-bottom: 0; list-style-type: circle; }
        .archive-content li { margin-bottom: 2px; }
        
        .archive-content .table-responsive { width: 100%; overflow-x: auto; margin: 10px 0; border-radius: 6px; border: 1px solid var(--border-color); }
        .archive-content table { width: 100%; min-width: 500px; border-collapse: collapse; font-size: 0.95em; background: #ffffff; }
        .archive-content th, .archive-content td { border: 1px solid var(--border-color); padding: 8px 10px; text-align: left; }
        .archive-content th { background-color: #f1f1f1; font-weight: bold; }
        .archive-content table tr th:first-child, .archive-content table tr td:first-child { border-left: none; }
        .archive-content table tr th:last-child, .archive-content table tr td:last-child { border-right: none; }
        .archive-content table tr:first-child th { border-top: none; }
        .archive-content table tr:last-child td { border-bottom: none; }
        
        .archive-content img { max-width: 100%; border-radius: 6px; border: 1px solid var(--border-color); margin: 8px 0; display: block; }
        .archive-content audio, .archive-content video { width: 100%; max-width: 600px; border-radius: 6px; border: 1px solid var(--border-color); margin: 8px 0; display: block; outline: none; }
        .archive-content video { background: #000; }
        .archive-content a { color: var(--suggest-color); text-decoration: underline; text-decoration-color: transparent; transition: 0.2s; font-weight: bold;}
        .archive-content a:hover { text-decoration-color: var(--suggest-color); }
        .archive-content strong { color: var(--accent-color); font-weight: bold; }
        .archive-content strong em { font-style: italic; background: #eee; padding: 0 4px; border-radius: 3px;}

        /* Tombol Scroll to Top di bawah arsip */
        .scroll-top-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 6px 12px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scroll-top-btn:hover {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        #input-container {
            background-color: var(--bg-color); padding: 12px 20px; border-top: 1px solid var(--border-color);
            display: flex; align-items: center; gap: 12px; flex-shrink: 0; padding-bottom: calc(12px + env(safe-area-inset-bottom)); 
        }

        .prompt { color: var(--accent-color); font-weight: bold; user-select: none; }
        input { flex-grow: 1; background: transparent; border: none; color: var(--text-color); font-family: inherit; font-size: 16px; outline: none; }
        input::placeholder { color: #b3b3b3; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 10px; }
        .table-responsive::-webkit-scrollbar-thumb { background: #c0c0c0; }

        #print-area { display: none; }

        @media print {
            body { background: #ffffff; color: #000000; height: auto !important; overflow: visible !important; }
            #output-container, #input-container { display: none !important; }
            #print-area { display: block !important; width: 100%; padding: 0; margin: 0; }
            .archive-content { border: none !important; background: transparent !important; padding: 0 !important; max-width: 100% !important; }
            .archive-content table { border-collapse: collapse !important; width: 100% !important; }
            .archive-content th, .archive-content td { border: 1px solid #000 !important; }
        }

        @media (max-width: 480px) {
            body { font-size: 13px; }
            .archive-item { flex-direction: column; gap: 4px; }
            #input-container { padding: 12px 15px; }
            .archive-content { padding: 15px; }
        }
    </style>
</head>
<body>

    <div id="print-area"></div>

    <div id="output-container">
        <!-- WELCOME MESSAGE -->
        <div class="line" style="font-weight: bold; font-size: 1.2em; margin-bottom: 8px;">📂 WebCLI Arsip / v11.0</div>
        <div class="line">Selamat datang di Sistem Manajemen Arsip Statis.</div>
        <div class="line" style="color: var(--text-muted); margin-bottom: 12px;">Program terminal virtual ini dirancang untuk membaca, mencari, mencetak (PDF), dan menampilkan dokumen secara efisien.</div>
        <div class="line">💡 Ketik <b style="color: var(--suggest-color);">help</b> lalu tekan Enter untuk melihat panduan.</div>
        <div class="line" style="border-bottom: 1px dashed var(--border-color); width: 100%; margin: 15px 0 5px 0;"></div>
    </div>
    
    <div id="input-container">
        <span class="prompt">arsip ~ %</span>
        <input type="text" id="commandInput" autofocus autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="none" placeholder="Ketik perintah di sini...">
    </div>

    <script>
        const outputContainer = document.getElementById('output-container');
        const input = document.getElementById('commandInput');
        const printArea = document.getElementById('print-area');

        /* ========================================================
           FUNGSI CUSTOM PARSER
           ======================================================== */
        function parseArsipText(text) {
            text = text.replace(/\r\n/g, '\n');
            const lines = text.split('\n');
            let html = '';
            
            let inList = false;
            let inSubList = false;
            let inTable = false;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                if (line === '') { html += '<div style="height: 6px;"></div>'; continue; }

                line = line.replace(/~\*(.*?)\*~/g, '<strong><em>$1</em></strong>'); 
                
                line = line.replace(/!\[(.*?)\]\((.*?)\)/g, function(match, alt, url) {
                    url = url.trim();
                    let typeId = alt.toLowerCase().trim();
                    if (typeId === 'aud' || typeId === 'audio' || url.match(/\.(mp3|wav|ogg)$/i)) { return `<audio controls src="${url}"></audio>`; } 
                    else if (typeId === 'vid' || typeId === 'video' || url.match(/\.(mp4|webm)$/i)) { return `<video controls src="${url}"></video>`; } 
                    else { return `<img src="${url}" alt="${alt || 'Gambar Arsip'}">`; }
                });

                line = line.replace(/~M\[\s*(.*?)\s*\Vert{}\s*(.*?)\s*\]/gi, function(match, type, url) {
                    type = type.toLowerCase().trim();
                    url = url.trim();
                    if (type.includes('aud')) return `<audio controls src="${url}"></audio>`;
                    if (type.includes('vid')) return `<video controls src="${url}"></video>`;
                    return `<img src="${url}" alt="Gambar">`;
                });

                line = line.replace(/\[([^\]]+)\]\((.*?)\)/g, function(match, label, url) {
                    return `<a href="${url.trim()}" target="_blank">${label.trim()}</a>`;
                });

                if (line.startsWith('~|')) {
                    if (!inTable) { html += '<div class="table-responsive"><table><thead><tr>'; inTable = true; }
                    let headers = line.substring(2).replace(/^\||\|$/g, '').split('|'); 
                    headers.forEach(h => html += `<th>${h.trim()}</th>`);
                    html += '</tr></thead><tbody>\n';
                    continue;
                } else if (inTable && line.startsWith('|')) {
                    html += '<tr>';
                    let cells = line.substring(1).replace(/\|$/g, '').split('|'); 
                    cells.forEach(c => html += `<td>${c.trim()}</td>`);
                    html += '</tr>\n';
                    continue;
                } else if (inTable) {
                    html += '</tbody></table></div>\n';
                    inTable = false;
                }

                if (line.startsWith('~>>')) {
                    if (!inList) { html += '<ul>\n'; inList = true; }
                    if (!inSubList) { html += '<ul>\n'; inSubList = true; }
                    html += `<li>${line.substring(3).trim()}</li>\n`;
                    continue;
                } else if (line.startsWith('~>')) {
                    if (inSubList) { html += '</ul>\n'; inSubList = false; }
                    if (!inList) { html += '<ul>\n'; inList = true; }
                    html += `<li>${line.substring(2).trim()}</li>\n`;
                    continue;
                } else {
                    if (inSubList) { html += '</ul>\n'; inSubList = false; }
                    if (inList) { html += '</ul>\n'; inList = false; }
                }

                if (line.startsWith('~#')) {
                    html += `<h3>${line.substring(2).trim()}</h3>\n`;
                    continue;
                }

                if (/^(<img|<audio|<video)/i.test(line.trim())) {
                    html += line + '\n';
                } else {
                    html += `<p>${line}</p>\n`;
                }
            }

            if (inSubList) html += '</ul>\n';
            if (inList) html += '</ul>\n';
            if (inTable) html += '</tbody></table></div>\n';

            return html;
        }

        /* ========================================================
           LOGIKA APLIKASI WEBCLI
           ======================================================== */
        function getLevenshteinDistance(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = [];
            for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
            for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) { matrix[i][j] = matrix[i - 1][j - 1]; } 
                    else { matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)); }
                }
            }
            return matrix[b.length][a.length];
        }

        // Fungsi scroll ke bagian paling bawah terminal
        function scrollToBottom() { 
            setTimeout(() => { outputContainer.scrollTop = outputContainer.scrollHeight; }, 10); 
        }

        // Fungsi scroll ke bagian atas awal arsip yang baru dibuka
        function scrollToElement(element) {
            setTimeout(() => {
                element.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 10);
        }

        function printLine(htmlContent, type = 'normal') {
            const line = document.createElement('div');
            line.className = `line ${type}`;
            line.innerHTML = htmlContent;
            outputContainer.appendChild(line);
            scrollToBottom();
            return line; // Mengembalikan elemen baris agar bisa dilacak
        }

        function sortByNewestDate(dataArray) {
            return dataArray.sort((a, b) => {
                const dateA = new Date(a.tanggal).getTime() || 0;
                const dateB = new Date(b.tanggal).getTime() || 0;
                return dateB - dateA; 
            });
        }

        async function processCommand(cmd) {
            const args = cmd.trim().split(/\s+/);
            const command = args[0].toLowerCase();

            printLine(`> ${cmd}`, 'command-echo');
            if (!command) return;

            switch (command) {
                case 'help':
                    printLine(`
                        <b>Perintah yang tersedia:</b><br>
                        <span style="color:var(--text-muted)">help</span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;- Menampilkan pesan ini<br>
                        <span style="color:var(--text-muted)">list</span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;- Menampilkan daftar arsip<br>
                        <span style="color:var(--text-muted)">search [kata]</span> - Mencari arsip berdasarkan judul<br>
                        <span style="color:var(--text-muted)">read [id]</span> &nbsp;&nbsp;&nbsp;- Membaca isi arsip<br>
                        <span style="color:var(--text-muted)">print [id]</span> &nbsp;&nbsp;- Mencetak arsip ke PDF<br>
                        <span style="color:var(--text-muted)">clear</span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;- Membersihkan layar terminal
                    `);
                    break;

                case 'list':
                    try {
                        const response = await fetch('metadata.json');
                        if (!response.ok) throw new Error('Gagal memuat metadata.json');
                        let data = await response.json();
                        if (data.length === 0) { printLine('Tidak ada arsip yang ditemukan.'); break; }

                        data = sortByNewestDate(data);
                        let html = '';
                        data.forEach(item => {
                            html += `
                                <div class="archive-item">
                                    <div class="archive-id">#${item.id}</div>
                                    <div class="archive-date">${item.tanggal}</div>
                                    <div class="archive-title">${item.judul}</div>
                                </div>
                            `;
                        });
                        printLine(html);
                    } catch (err) { printLine(`Error: ${err.message}`, 'error'); }
                    break;

                case 'search':
                    const keywordArgs = args.slice(1);
                    if (keywordArgs.length === 0) { printLine("Gunakan format: search [kata kunci]", 'error'); break; }
                    const keywordFull = keywordArgs.join(" ").toLowerCase();

                    try {
                        const response = await fetch('metadata.json');
                        if (!response.ok) throw new Error('Gagal memuat metadata.json');
                        const data = await response.json();
                        
                        let results = data.filter(item => {
                            const titleLower = item.judul.toLowerCase();
                            if (titleLower.includes(keywordFull)) return true;
                            const titleWords = titleLower.split(/\s+/);
                            for (const tWord of titleWords) {
                                for (const kWord of keywordArgs) {
                                    if (kWord.length > 3 && getLevenshteinDistance(tWord, kWord.toLowerCase()) <= 2) return true;
                                }
                            }
                            return false;
                        });

                        if (results.length === 0) { printLine(`Tidak ada arsip yang cocok dengan <b>'${keywordFull}'</b>.`); break; }

                        results = sortByNewestDate(results);
                        let html = `<div style="margin-bottom: 6px; color: var(--text-muted);">Menemukan ${results.length} hasil:</div>`;
                        results.forEach(item => {
                            html += `
                                <div class="archive-item">
                                    <div class="archive-id">#${item.id}</div>
                                    <div class="archive-date">${item.tanggal}</div>
                                    <div class="archive-title">${item.judul}</div>
                                );
                            `;
                        });
                        printLine(html);
                    } catch (err) { printLine(`Error: ${err.message}`, 'error'); }
                    break;

                case 'read':
                    const id = args[1];
                    if (!id) { printLine("Gunakan format: read [id]", 'error'); break; }

                    try {
                        const response = await fetch(`${id}.txt`);
                        if (!response.ok) throw new Error(`File arsip ${id}.txt tidak ditemukan.`);
                        
                        const content = await response.text();
                        const parsedHTML = parseArsipText(content);
                        
                        // Cetak arsip ke layar dan tangkap elemen pembungkusnya
                        const printedLine = printLine(`
                            <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Membaca Arsip #${id}...</div>
                            <div class="archive-content">
                                ${parsedHTML}
                                <div style="text-align: right; border-top: 1px dashed var(--border-color); margin-top: 15px; padding-top: 5px;">
                                    <button class="scroll-top-btn" onclick="scrollToElement(this.closest('.line').previousElementSibling || this.closest('.line'))">
                                        ^ Back to top
                                    </button>
                                </div>
                            </div>
                        `);

                        // Otomatis arahkan pandangan (scroll) ke bagian atas arsip yang baru dibuka
                        scrollToElement(printedLine);

                    } catch (err) { printLine(`Error: ${err.message}`, 'error'); }
                    break;

                case 'print':
                    const printId = args[1];
                    if (!printId) { printLine("Gunakan format: print [id] (Contoh: print 1)", 'error'); break; }

                    try {
                        const metaRes = await fetch('metadata.json');
                        if (!metaRes.ok) throw new Error('Gagal memuat metadata.json');
                        const metaData = await metaRes.json();
                        const archiveMeta = metaData.find(item => String(item.id) === String(printId));
                        
                        if (!archiveMeta) throw new Error(`Data arsip #${printId} tidak ditemukan di metadata.`);

                        const contentRes = await fetch(`${printId}.txt`);
                        if (!contentRes.ok) throw new Error(`File arsip ${printId}.txt tidak ditemukan.`);
                        
                        const content = await contentRes.text();
                        const parsedHTML = parseArsipText(content);
                        
                        printArea.innerHTML = `
                            <div style="margin-bottom: 25px; border-bottom: 2px solid #000; padding-bottom: 12px;">
                                <h1 style="margin: 0 0 5px 0; font-size: 1.8em;">${archiveMeta.judul}</h1>
                                <div style="color: #444; font-size: 0.9em;">
                                    <b>ID Arsip:</b> #${archiveMeta.id} &nbsp;|&nbsp; <b>Tanggal:</b> ${archiveMeta.tanggal}
                                </div>
                            </div>
                            <div class="archive-content">
                                ${parsedHTML}
                            </div>
                        `;

                        printLine(`<div style="color: var(--suggest-color);">Menyiapkan dokumen #${printId} untuk dicetak...</div>`);
                        setTimeout(() => { window.print(); }, 300);

                    } catch (err) { printLine(`Error: ${err.message}`, 'error'); }
                    break;

                case 'clear':
                    outputContainer.innerHTML = '';
                    printLine(`
                        <div style="font-weight: bold; font-size: 1.2em; margin-bottom: 8px;">📂 WebCLI Arsip / v11.0</div>
                        <div>Selamat datang di Sistem Manajemen Arsip Statis.</div>
                        <div style="color: var(--text-muted); margin-bottom: 12px;">Program terminal virtual ini dirancang untuk membaca, mencari, mencetak (PDF), dan menampilkan dokumen secara efisien.</div>
                        <div>💡 Ketik <b style="color: var(--suggest-color);">help</b> lalu tekan Enter untuk melihat panduan penggunaan.</div>
                        <div style="border-bottom: 1px dashed var(--border-color); width: 100%; margin: 15px 0 5px 0;"></div>
                    `);
                    break;

                default:
                    printLine(`Perintah tidak dikenali: '${command}'. Ketik 'help' untuk bantuan.`, 'error');
                    break;
            }
        }

        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                const cmd = input.value;
                if (cmd.trim() !== '') {
                    input.value = '';
                    processCommand(cmd);
                }
            }
        });

        outputContainer.addEventListener('click', () => {
            if (window.getSelection().toString() === '') input.focus();
        });
        
        // Mencegah auto-resize melompat tidak stabil di mobile
        window.addEventListener('resize', () => {});
    </script>
</body>
</html>
