<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WEB Tools</title>
    <link rel="icon" type="image/x-icon" href="icon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <style>
        :root {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --border: #e2e2e4;
            --active-bg: #ececee;
            --accent: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 960px;
            height: 100%;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.04);
            position: relative;
        }

        header {
            padding: 24px 20px 14px 20px;
            background-color: var(--bg);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 11px 16px 11px 38px;
            font-size: 0.95rem;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s ease;
            user-select: text;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.04);
            border: none;
        }

        .search-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-secondary);
            pointer-events: none;
        }

        main {
            flex-grow: 1;
            overflow-y: auto;
            padding: 8px 20px 24px 20px;
            -webkit-overflow-scrolling: touch;
        }

        .section-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 8px;
            margin-top: 4px;
            padding-left: 4px;
        }

        .archive-group {
            background-color: var(--surface);
            border-radius: 14px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.01);
        }

        .archive-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 16px;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 400;
            transition: background-color 0.12s ease, transform 0.1s ease;
            position: relative;
            cursor: pointer;
        }

        .archive-item:not(:last-child):after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            left: 16px;
            height: 1px;
            background-color: var(--border);
        }

        .archive-item:hover {
            background-color: var(--active-bg);
        }

        .archive-item:active {
            transform: scale(0.99);
        }

        .item-label {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-arrow {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 300;
            line-height: 1;
            transition: transform 0.2s ease;
        }

        .archive-item:hover .item-arrow {
            transform: translateX(3px);
            color: var(--text-primary);
        }

        .state-message {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        footer {
            padding: 14px;
            text-align: center;
            font-size: 0.75rem; 
            color: var(--text-secondary);
            flex-shrink: 0;
            background-color: var(--bg);
            border-top: 1px solid rgba(0,0,0,0.03);
        }

        @media (min-width: 768px) {
            body {
                background-color: #e9e9eb;
            }
            .app-container {
                border-left: 1px solid var(--border);
                border-right: 1px solid var(--border);
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="search-wrapper">
                <svg class="search-icon" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Cari program..." autocomplete="off">
            </div>
        </header>

        <main>
            <div class="section-label" id="sectionTitle">Semua Program</div>
            <div class="archive-group" id="archiveContainer">
                <div class="state-message">Memuat data...</div>
            </div>
            <div id="emptyState" class="state-message" style="display: none;">Program tidak ditemukan.</div>
        </main>

        <footer>
            WEB Tools PWA &bull; 2026
        </footer>
    </div>

    <script>
        // Pendaftaran Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }

        let archives = [];
        const container = document.getElementById('archiveContainer');
        const emptyState = document.getElementById('emptyState');
        const sectionTitle = document.getElementById('sectionTitle');
        const searchInput = document.getElementById('searchInput');

        function createSlug(name) {
            return name
                .toLowerCase()
                .replace(/&/g, 'dan')
                .replace(/[^a-z0-9\s-]/g, '')
                .trim()
                .replace(/\s+/g, '-');
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        async function loadDatabase() {
            const paths = ['database.json', './database.json', '../database.json'];
            let dataLoaded = false;

            for (let path of paths) {
                try {
                    let response = await fetch(path);
                    if (response.ok) {
                        archives = await response.json();
                        renderList(archives);
                        dataLoaded = true;
                        break;
                    }
                } catch (e) {}
            }

            if (!dataLoaded) {
                container.innerHTML = `<div class="state-message" style="color: #dc2626;">Gagal memuat database.json.</div>`;
                sectionTitle.style.display = 'none';
            }
        }

        function renderList(data) {
            container.innerHTML = "";
            if (data.length === 0) {
                emptyState.style.display = "block";
                sectionTitle.style.display = "none";
                container.style.display = "none";
                return;
            }
            emptyState.style.display = "none";
            sectionTitle.style.display = "block";
            container.style.display = "block";

            let htmlContent = "";
            data.forEach(item => {
                const name = item.name || "";
                const slug = createSlug(name);
                
                const safeName = escapeHTML(name);
                const safeSlug = encodeURIComponent(slug);
                
                htmlContent += `
                    <a href="tools/programtool/programtool.html?tool=${safeSlug}" class="archive-item">
                        <span class="item-label">${safeName}</span>
                        <span class="item-arrow">&rsaquo;</span>
                    </a>
                `;
            });
            container.innerHTML = htmlContent;
        }

        // Fungsi Debounce untuk mengoptimalkan performa pencarian (jeda 250ms)
        function debounce(func, delay) {
            let timeoutId;
            return function(...args) {
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => {
                    func.apply(this, args);
                }, delay);
            };
        }

        // Implementasi Debounce pada event input pencarian
        const handleSearch = debounce((e) => {
            const query = e.target.value.toLowerCase().trim();
            const filtered = archives.filter(item => item.name.toLowerCase().includes(query));
            renderList(filtered);
        }, 250);

        searchInput.addEventListener('input', handleSearch);

        document.addEventListener('DOMContentLoaded', loadDatabase);
    </script>
</body>
</html>
