<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode & QR Code Scanner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Html5-qrcode Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center py-6 px-4">

    <!-- Container Utama -->
    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-700 flex flex-col">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-4 text-center">
            <h1 class="text-xl font-bold flex items-center justify-center gap-2">
                <i class="fa-solid fa-qrcode"></i> Barcode & QR Scanner
            </h1>
            <p class="text-xs text-blue-100 mt-1">Arahkan kamera ke barcode atau QR code</p>
        </div>

        <!-- Area Kamera -->
        <div class="p-4 bg-slate-900/50 flex flex-col items-center relative">
            <div id="reader" class="w-full rounded-xl overflow-hidden border border-slate-700 bg-black min-h-[250px]"></div>
            
            <!-- Pesan Error / Status Kamera -->
            <div id="error-msg" class="hidden mt-3 p-3 bg-red-900/50 border border-red-700 rounded-lg text-xs text-red-200 text-center w-full"></div>
            
            <!-- Kontrol Kamera (Pilih Kamera & Tombol Start/Stop) -->
            <div class="flex gap-2 w-full mt-3">
                <select id="camera-select" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg p-2.5 flex-1 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Memuat kamera...</option>
                </select>
                <button id="btn-toggle" onclick="toggleScanner()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-lg transition flex items-center gap-1.5 shadow">
                    <i class="fa-solid fa-power-off"></i> <span id="btn-toggle-text">Mulai</span>
                </button>
            </div>
        </div>

        <!-- Bagian Hasil / Riwayat Scan -->
        <div class="p-4 flex-1 flex flex-col">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-2">
                    <h2 class="text-sm font-semibold text-slate-300">Hasil Scan</h2>
                    <span id="counter" class="bg-blue-900 text-blue-200 text-[10px] font-bold px-2 py-0.5 rounded-full">0</span>
                </div>
                <div class="flex gap-2">
                    <!-- Tombol Salin Semua -->
                    <button onclick="copyAllScans()" id="btn-copy-all" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 font-medium transition disabled:opacity-50" disabled>
                        <i class="fa-solid fa-copy"></i> Salin Semua
                    </button>
                    <!-- Tombol Hapus Semua -->
                    <button onclick="clearAllScans()" id="btn-clear-all" class="text-xs text-red-400 hover:text-red-300 flex items-center gap-1 font-medium transition disabled:opacity-50" disabled>
                        <i class="fa-solid fa-trash"></i> Hapus Semua
                    </button>
                </div>
            </div>

            <!-- List Item -->
            <div id="scan-list" class="space-y-2.5 max-h-[280px] overflow-y-auto pr-1">
                <!-- Placeholder kosong -->
                <div id="empty-state" class="text-center py-8 text-slate-500 text-xs flex flex-col items-center gap-2">
                    <i class="fa-solid fa-barcode text-2xl opacity-40"></i>
                    Belum ada barcode atau QR code yang dipindai.
                </div>
            </div>
        </div>

    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 bg-emerald-600 text-white text-xs px-4 py-2.5 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2 z-50">
        <i class="fa-solid fa-circle-check"></i> <span id="toast-text">Berhasil disalin!</span>
    </div>

    <!-- Script Logika -->
    <script>
        let html5QrCode = null;
        let scanResults = [];
        let isScanning = false;

        // Inisialisasi awal saat halaman dimuat
        document.addEventListener("DOMContentLoaded", async () => {
            html5QrCode = new Html5Qrcode("reader");
            await getCameras();
            startScanner(); // Otomatis mencoba menyalakan kamera utama
        });

        // Ambil daftar kamera yang tersedia di perangkat
        async function getCameras() {
            try {
                const devices = await Html5Qrcode.getCameras();
                const select = document.getElementById("camera-select");
                select.innerHTML = "";
                
                if (devices && devices.length) {
                    devices.forEach((device, index) => {
                        const option = document.createElement("option");
                        option.value = device.id;
                        if (device.label.toLowerCase().includes('back') || device.label.toLowerCase().includes('rear') || index === devices.length - 1) {
                            option.selected = true;
                        }
                        option.text = device.label || `Kamera ${index + 1}`;
                        select.appendChild(option);
                    });
                } else {
                    select.innerHTML = '<option value="">Tidak ada kamera terdeteksi</option>';
                }
            } catch (err) {
                console.error("Gagal mendeteksi kamera:", err);
                showError("Tidak dapat mengakses kamera. Pastikan izin kamera diberikan pada browser.");
            }
        }

        // Toggle Mulai / Berhenti Scanner
        async function toggleScanner() {
            if (isScanning) {
                await stopScanner();
            } else {
                await startScanner();
            }
        }

        async function startScanner() {
            const cameraId = document.getElementById("camera-select").value;
            if (!cameraId) {
                showError("Pilih kamera terlebih dahulu.");
                return;
            }

            hideError();
            const qrConfig = { 
                fps: 10, 
                qrbox: { width: 250, height: 150 },
                aspectRatio: 1.0
            };

            try {
                await html5QrCode.start(
                    cameraId, 
                    qrConfig, 
                    onScanSuccess, 
                    onScanFailure
                );
                isScanning = true;
                updateToggleBtnUI(true);
            } catch (err) {
                console.error("Error starting scanner:", err);
                showError("Gagal membuka kamera: " + (err.message || err));
            }
        }

        async function stopScanner() {
            if (html5QrCode && isScanning) {
                try {
                    await html5QrCode.stop();
                    isScanning = false;
                    updateToggleBtnUI(false);
                } catch (err) {
                    console.error("Gagal menghentikan scanner:", err);
                }
            }
        }

        function updateToggleBtnUI(active) {
            const btnText = document.getElementById("btn-toggle-text");
            const btn = document.getElementById("btn-toggle");
            if (active) {
                btnText.innerText = "Berhenti";
                btn.className = "bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-4 py-2.5 rounded-lg transition flex items-center gap-1.5 shadow";
            } else {
                btnText.innerText = "Mulai";
                btn.className = "bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-lg transition flex items-center gap-1.5 shadow";
            }
        }

        // Fungsi saat barcode berhasil dibaca
        function onScanSuccess(decodedText, decodedResult) {
            // Cek apakah teks yang sama sudah ada di dalam array scanResults
            const isDuplicate = scanResults.some(item => item.text === decodedText);

            if (isDuplicate) {
                // Opsional: Beritahu pengguna jika kode sudah ada di riwayat
                showToast("Kode sudah ada di dalam daftar!");
                return;
            }

            // Tambahkan ke array riwayat di posisi paling atas jika belum ada
            scanResults.unshift({
                id: Date.now() + Math.random(),
                text: decodedText,
                format: decodedResult?.result?.format?.formatName || "BARCODE / QR",
                time: new Date().toLocaleTimeString()
            });

            renderList();
            showToast("Berhasil memindai kode baru!");
        }

        function onScanFailure(error) {
            // Error tipikal saat tidak ada kode dalam frame
        }

        // Hapus satu item spesifik
        function deleteItem(id) {
            scanResults = scanResults.filter(item => item.id !== id);
            renderList();
        }

        // Hapus semua riwayat
        function clearAllScans() {
            if (confirm("Apakah Anda yakin ingin menghapus semua hasil scan?")) {
                scanResults = [];
                renderList();
            }
        }

        // Salin satu teks ke clipboard
        function copyText(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                showToast("Teks disalin ke clipboard!");
                const icon = btnElement.querySelector("i");
                icon.className = "fa-solid fa-check text-emerald-400";
                setTimeout(() => {
                    icon.className = "fa-solid fa-copy";
                }, 1500);
            }).catch(err => {
                showError("Gagal menyalin teks.");
            });
        }

        // Salin semua teks sekaligus
        function copyAllScans() {
            if (scanResults.length === 0) return;
            const allText = scanResults.map(item => item.text).join("\n");
            navigator.clipboard.writeText(allText).then(() => {
                showToast("Semua teks berhasil disalin!");
                const btn = document.getElementById("btn-copy-all");
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Disalin Semua!';
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                }, 2000);
            }).catch(err => {
                showError("Gagal menyalin semua teks.");
            });
        }

        // Render daftar riwayat ke HTML
        function renderList() {
            const container = document.getElementById("scan-list");
            const counter = document.getElementById("counter");
            const btnClearAll = document.getElementById("btn-clear-all");
            const btnCopyAll = document.getElementById("btn-copy-all");

            counter.innerText = scanResults.length;

            if (scanResults.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-slate-500 text-xs flex flex-col items-center gap-2">
                        <i class="fa-solid fa-barcode text-2xl opacity-40"></i>
                        Belum ada barcode atau QR code yang dipindai.
                    </div>
                `;
                btnClearAll.disabled = true;
                btnCopyAll.disabled = true;
                return;
            }

            btnClearAll.disabled = false;
            btnCopyAll.disabled = false;

            container.innerHTML = "";
            scanResults.forEach(item => {
                const div = document.createElement("div");
                div.className = "bg-slate-800/80 border border-slate-700/80 hover:border-slate-600 rounded-xl p-3 flex items-center justify-between gap-3 transition shadow-sm";
                div.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-0.5">
                            <span class="bg-slate-700 text-slate-300 text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wider">${item.format}</span>
                            <span class="text-[10px] text-slate-400">${item.time}</span>
                        </div>
                        <p class="text-xs font-mono text-slate-100 truncate select-all" title="${item.text}">${item.text}</p>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button onclick="copyText('${item.text.replace(/'/g, "\\'")}', this)" class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-2 rounded-lg transition text-xs" title="Salin">
                            <i class="fa-solid fa-copy"></i>
                        </button>
                        <button onclick="deleteItem(${item.id})" class="bg-red-950/60 hover:bg-red-900 text-red-300 p-2 rounded-lg transition text-xs" title="Hapus">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // Tampilkan pesan error
        function showError(message) {
            const errDiv = document.getElementById("error-msg");
            errDiv.innerText = message;
            errDiv.classList.remove("hidden");
        }

        // Sembunyikan pesan error
        function hideError() {
            const errDiv = document.getElementById("error-msg");
            errDiv.classList.add("hidden");
        }

        // Tampilkan Toast Notifikasi
        function showToast(message) {
            const toast = document.getElementById("toast");
            const toastText = document.getElementById("toast-text");
            toastText.innerText = message;
            toast.classList.remove("translate-y-20", "opacity-0");
            setTimeout(() => {
                toast.classList.add("translate-y-20", "opacity-0");
            }, 2500);
        }
    </script>
</body>
</html>
