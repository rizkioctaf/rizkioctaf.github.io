<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Mencegah zoom otomatis pada perangkat layar sentuh saat mengisi form -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Creator Studio - SecureReader</title>
    <meta name="description" content="Alat pembuat dan pengenkripsi artikel rahasia SecureReader secara client-side.">

    <!-- Konfigurasi PWA & Ikon -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FCFCFC">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="logo.svg">

    <!-- Optimasi Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Pemanggilan CSS Modular (Termasuk article.css agar Live Preview identik dengan hasil baca) -->
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/article.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    
    <!-- Library Eksternal: CryptoJS untuk mengenkripsi tulisan & Chart.js untuk pratinjau grafik -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<!-- ID "page-create" menandai halaman Studio Editor -->
<body id="page-create">

    <noscript>
        <div style="background: #18181B; color: #FAFAFA; padding: 20px; text-align: center; font-family: sans-serif; z-index: 9999; position: relative;">
            <strong>Peringatan Keamanan:</strong> Studio Editor ini membutuhkan JavaScript untuk melakukan enkripsi data. Harap aktifkan JavaScript Anda.
        </div>
    </noscript>

    <!-- Wadah Notifikasi Pop-up (Toast) -->
    <div id="toast-container" aria-live="polite"></div>

    <!-- Header Navigasi Studio -->
    <header>
        <div class="nav-container" style="max-width: 1360px;">
            <!-- Logo berfungsi sebagai tombol kembali ke halaman Beranda -->
            <a href="index.html" class="logo" aria-label="Kembali ke Beranda" title="Kembali ke Beranda">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                SecureReader Creator
            </a>
        </div>
    </header>

    <!-- =====================================================================
         TATA LETAK 2 KOLOM (SPLIT-SCREEN WORKSPACE)
         Kiri: Panel Editor & Formulir Enkripsi
         Kanan: Panel Pratinjau Langsung (Live Preview)
         Otomatis menumpuk menjadi 1 kolom di layar tablet/HP
         ===================================================================== -->
    <main class="create-container">
        
        <!-- KOLOM 1 (KIRI): PANEL EDITOR & FORMULIR ENKRIPSI -->
        <section class="panel" aria-labelledby="editorTitle">
            <h2 id="editorTitle">Penulis & Mesin Enkripsi</h2>
            
            <!-- Input ID Artikel (Akan disanitasi menjadi huruf kecil & tanda hubung sebagai nama file .json) -->
            <div class="form-group">
                <label for="articleId">ID Artikel (Nama File)</label>
                <input type="text" id="articleId" placeholder="contoh: rahasia-123" required autocomplete="off" spellcheck="false">
            </div>
            
            <!-- Input Judul Artikel (Ditampilkan di daftar Beranda / metadata.json) -->
            <div class="form-group">
                <label for="articleTitle">Judul Artikel (Tampil di Beranda)</label>
                <input type="text" id="articleTitle" placeholder="Ketik judul artikel..." required>
            </div>
            
            <!-- Input Kata Sandi Kunci Enkripsi (Otomatis mendapat tombol intip sandi dari dom.js) -->
            <div class="form-group">
                <label for="articlePassword">Kata Sandi (Kunci Pembuka)</label>
                <input type="password" id="articlePassword" class="pw-input" placeholder="Buat sandi yang kuat..." required autocomplete="off" spellcheck="false" style="margin-bottom: 0;">
            </div>
            
            <!-- Area Pengetikan Konten Markdown Kustom (Mengisi sisa tinggi panel secara fleksibel) -->
            <div class="form-group" style="flex-grow: 1;">
                <label for="articleContent">Isi Konten (Format Markdown Kustom)</label>
                <textarea id="articleContent" placeholder="Gunakan # untuk judul besar, **teks** untuk tebal, atau @grafik[bar](A:10, B:20)..."></textarea>
            </div>
            
            <!-- Tombol Pemicu Enkripsi & Unduh (Event listener dipasang secara bersih di create.js) -->
            <button type="button" id="btnEncrypt" class="btn-unlock" aria-label="Mulai Enkripsi dan Unduh">
                Enkripsi & Unduh .json
            </button>
            
            <!-- Kotak Instruksi & Potongan Kode JSON untuk disalin ke metadata.json -->
            <div id="metadataResult" class="metadata-box" aria-live="polite"></div>
        </section>

        <!-- KOLOM 2 (KANAN): PANEL PRATINJAU LANGSUNG (LIVE PREVIEW) -->
        <section class="panel" aria-labelledby="previewTitle">
            <h2 id="previewTitle">Pratinjau Layar</h2>
            
            <!-- Wadah hasil render real-time dari parseContent() dan renderCharts() -->
            <div class="preview-content" id="previewContainer" aria-live="polite">
                <div style="text-align: center; color: var(--text-muted); margin-top: 100px;">
                    Mulai mengetik di kolom sebelah kiri untuk melihat hasil desain secara langsung...
                </div>
            </div>
        </section>
        
    </main>

    <!-- Memanggil modul logika khusus halaman Creator Studio -->
    <script type="module" src="assets/js/pages/create.js"></script>
</body>
</html>
