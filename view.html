<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baca Arsip</title>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent: #2563eb;
            --gray-light: #f1f5f9;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0; padding: 0;
            -webkit-font-smoothing: antialiased;
            line-height: 1.7;
            font-size: 1rem;
        }

        /* --- STICKY NAVBAR --- */
        .navbar {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .nav-content {
            width: 100%;
            max-width: 720px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 12px;
            background: var(--gray-light);
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .back-btn:hover { background: #e2e8f0; color: var(--accent); }

        /* --- MENU DROPDOWN --- */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--gray-light);
            color: var(--text-main);
            border: none;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .dropdown-btn:hover { background: #e2e8f0; color: var(--accent); }
        
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            background: var(--bg-card);
            min-width: 220px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            z-index: 200;
            overflow: hidden;
            animation: fadeIn 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dropdown.active .dropdown-content { display: block; }
        
        .dropdown-header {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            padding: 10px 14px 4px 14px;
        }
        .dropdown-content a, .dropdown-content button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 14px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.85rem;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s;
        }
        .dropdown-content a:hover, .dropdown-content button:hover {
            background: var(--gray-light);
            color: var(--accent);
        }
        .dropdown-divider {
            height: 1px;
            background: var(--border-color);
            margin: 4px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- CONTAINER KONTEN ARSIP --- */
        .container {
            max-width: 720px;
            margin: 24px auto 60px auto;
            padding: 0 20px;
        }
        .archive-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow-sm);
        }

        .msg { font-style: italic; color: var(--text-muted); text-align: center; padding: 40px 0; }

        /* --- TYPOGRAPHY & PARSER --- */
        #archive-content { text-align: left; }
        
        h1, h2, h3 { color: var(--text-main); font-weight: 700; line-height: 1.3; margin: 24px 0 12px 0; scroll-margin-top: 80px; page-break-after: avoid; break-after: avoid; }
        h1 { font-size: 1.6rem; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }
        h2 { font-size: 1.3rem; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
        h3 { font-size: 1.1rem; }
        
        strong { font-weight: 600; color: var(--text-main); }
        em { font-style: italic; }
        .parsed { margin: 0 0 12px 0; color: #334155; }
        .spacer { height: 16px; }

        .parsed-list { margin: 8px 0 16px 0; padding-left: 24px; color: #334155; }
        li { margin-bottom: 4px; }

        /* Tabel Modern */
        .table-wrapper {
            width: 100%; overflow-x: auto; margin: 20px 0; border-radius: 8px; border: 1px solid var(--border-color); -webkit-overflow-scrolling: touch;
            page-break-inside: avoid; break-inside: avoid;
        }
        .parsed-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; background: #fff; }
        .parsed-table th, .parsed-table td { border-bottom: 1px solid var(--border-color); border-right: 1px solid var(--border-color); padding: 10px 14px; text-align: left; white-space: nowrap; }
        .parsed-table th:last-child, .parsed-table td:last-child { border-right: none; }
        .parsed-table th { background-color: var(--gray-light); color: var(--text-main); font-weight: 600;}

        .parsed-img, .parsed-video { max-width: 100%; border-radius: 8px; border: 1px solid var(--border-color); display: block; margin: 16px 0; box-shadow: var(--shadow-sm); page-break-inside: avoid; break-inside: avoid; }
        .parsed-audio { width: 100%; margin: 16px 0; outline: none; }

        /* --- GRAFIK UMUM --- */
        .chart-box { 
            border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; margin: 24px 0; background: #ffffff; box-shadow: var(--shadow-sm); 
            page-break-inside: avoid; break-inside: avoid;
        }
        .chart-title { font-weight: 700; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .chart-scroll-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        
        /* Bar Chart */
        .chart-row { display: flex; align-items: center; margin-bottom: 8px; }
        .chart-label { width: 140px; font-size: 0.85rem; font-weight: 500; flex-shrink: 0; padding-right: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-main); }
        .chart-bar-wrap { flex-grow: 1; background: var(--gray-light); height: 22px; border-radius: 6px; position: relative; overflow: hidden; }
        .chart-bar { height: 100%; font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; padding-left: 8px; white-space: nowrap; border-radius: 6px; }
        
        /* --- PIE CHART --- */
        .pie-column-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 20px; 
            padding: 10px 0;
            width: 100%;
        }
        
        .pie-chart-large { 
            width: 180px; 
            height: 180px; 
            border-radius: 50%; 
            border: 2px solid var(--border-color); 
            position: relative;
            box-shadow: var(--shadow-md); 
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .pie-chart-large::before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: var(--text-main);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
            box-shadow: var(--shadow-md);
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            pointer-events: none;
        }
        .pie-chart-large.hovered::before {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .pie-chart-large::after {
            content: attr(data-total-label);
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            pointer-events: none;
        }
        
        .pie-legends-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 8px;
        }
        .pie-legends-grid { 
            display: grid;
            grid-template-rows: repeat(5, auto);
            grid-auto-flow: column;
            gap: 8px 12px;
            width: max-content;
            margin: 0 auto;
        }
        .pie-legend-card { 
            display: flex; 
            align-items: center; 
            background: var(--gray-light);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.8rem; 
            color: var(--text-main); 
            font-weight: 500;
            border: 1px solid var(--border-color);
            white-space: nowrap;
        }
        .color-box { 
            width: 12px; 
            height: 12px; 
            display: inline-block; 
            margin-right: 8px; 
            border-radius: 3px; 
            flex-shrink: 0; 
        }
        
        .line-svg { height: 180px; display: block; font-family: inherit; }

        /* --- ATURAN CETAK (PRINT TO PDF) BERSIH MURNI KONTEN --- */
        @media print {
            /* Sembunyikan navbar, tombol kembali, dan menu dropdown secara total */
            .navbar { display: none !important; }
            
            body { 
                background: #ffffff !important; 
                color: #000000 !important;
            }
            .container { 
                max-width: 100% !important; 
                margin: 0 !important; 
                padding: 0 !important; 
            }
            .archive-card { 
                border: none !important; 
                box-shadow: none !important; 
                padding: 0 !important; 
            }
            .chart-box { 
                box-shadow: none !important; 
                border: 1px solid #cbd5e1 !important; 
                page-break-inside: avoid;
            }
            .pie-legends-wrapper { overflow: visible !important; }
            .pie-legends-grid { 
                width: 100% !important; 
                grid-auto-flow: row !important; 
                grid-template-columns: repeat(3, 1fr) !important; 
            }
        }

        @media (max-width: 480px) {
            .container { padding: 0 12px; margin: 16px auto; }
            .archive-card { padding: 20px 16px; }
            .pie-chart-large { width: 160px; height: 160px; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-content">
            <a href="index.html" class="back-btn">
                <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                Kembali
            </a>

            <div class="dropdown" id="navDropdown">
                <button class="dropdown-btn" onclick="toggleDropdown()">
                    Menu 
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                </button>
                <div class="dropdown-content">
                    <div class="dropdown-header">Daftar Isi (Sub-Bab)</div>
                    <div id="tocList">
                        <span style="padding: 8px 14px; display:block; font-size:0.8rem; color:var(--text-muted); font-style:italic;">Tidak ada sub-judul</span>
                    </div>
                    <div class="dropdown-divider"></div>
                    <!-- Memanggil window.print() bawaan browser -->
                    <button onclick="downloadPDF()">Unduh / Cetak PDF</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="archive-card" id="pdfContent">
            <div id="content-container">
                <div class="msg">Membaca isi arsip...</div>
            </div>
        </div>
    </main>

    <script>
        function toggleDropdown() {
            document.getElementById('navDropdown').classList.toggle('active');
        }

        window.addEventListener('click', function(e) {
            if (!document.getElementById('navDropdown').contains(e.target)) {
                document.getElementById('navDropdown').classList.remove('active');
            }
        });

        function parseToHTML(text) {
            const lines = text.split('\n');
            let html = '<div id="archive-content">';
            let inList = false; let listLevel = 0;
            let inTable = false; let tableRow = 0;
            let emptyLinesCount = 0;
            let tocItems = [];
            let h2Counter = 0;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].replace(/\r/g, '').trim(); 

                if (line.startsWith('[grafik:') && line.endsWith(']')) {
                    if (inList) { while (listLevel >= 0) { html += '</ul>'; listLevel--; } inList = false; }
                    if (inTable) { html += '</tbody></table></div>'; inTable = false; }
                    emptyLinesCount = 0;

                    const inner = line.substring(8, line.length - 1);
                    const colonIndex = inner.indexOf(':');
                    
                    if (colonIndex !== -1) {
                        const chartType = inner.substring(0, colonIndex).trim().toLowerCase();
                        const chartData = inner.substring(colonIndex + 1).trim();
                        html += buildChart(chartType, chartData);
                        continue;
                    }
                }

                let rawLine = lines[i].replace(/\r/g, '');

                if (rawLine.trim() === '') {
                    emptyLinesCount++;
                    if (emptyLinesCount > 1) { html += '<div class="spacer"></div>'; }
                    continue;
                } else {
                    emptyLinesCount = 0;
                }

                rawLine = rawLine.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                rawLine = rawLine.replace(/\*(.*?)\*/g, '<em>$1</em>');
                rawLine = rawLine.replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1" class="parsed-img">');
                rawLine = rawLine.replace(/\[audio:(.*?)\]/g, '<audio controls src="$1" class="parsed-audio"></audio>');
                rawLine = rawLine.replace(/\[video:(.*?)\]/g, '<video controls src="$1" class="parsed-video"></video>');

                if (rawLine.match(/^### (.*)/)) { 
                    if (inList) { while (listLevel >= 0) { html += '</ul>'; listLevel--; } inList = false; }
                    if (inTable) { html += '</tbody></table></div>'; inTable = false; }
                    html += `<h3>${rawLine.substring(4)}</h3>`; continue; 
                }
                
                if (rawLine.match(/^## (.*)/)) { 
                    if (inList) { while (listLevel >= 0) { html += '</ul>'; listLevel--; } inList = false; }
                    if (inTable) { html += '</tbody></table></div>'; inTable = false; }
                    
                    const titleText = rawLine.substring(3).trim();
                    const anchorId = `section-${h2Counter++}`;
                    tocItems.push({ text: titleText, id: anchorId });
                    
                    html += `<h2 id="${anchorId}">${titleText}</h2>`; 
                    continue; 
                }

                if (rawLine.match(/^# (.*)/)) { 
                    if (inList) { while (listLevel >= 0) { html += '</ul>'; listLevel--; } inList = false; }
                    if (inTable) { html += '</tbody></table></div>'; inTable = false; }
                    html += `<h1>${rawLine.substring(2)}</h1>`; continue; 
                }

                if (rawLine.trim().startsWith('|') && rawLine.trim().endsWith('|')) {
                    if (!inTable) {
                        html += '<div class="table-wrapper"><table class="parsed-table"><tbody>';
                        inTable = true; tableRow = 0;
                    }
                    if (rawLine.includes('---')) continue; 
                    
                    const cells = rawLine.split('|').slice(1, -1).map(c => c.trim());
                    html += '<tr>' + cells.map(c => tableRow === 0 ? `<th>${c}</th>` : `<td>${c}</td>`).join('') + '</tr>';
                    tableRow++; continue;
                } else if (inTable) {
                    html += '</tbody></table></div>'; inTable = false;
                }

                const listMatch = rawLine.match(/^(\s*)-\s+(.*)/);
                if (listMatch) {
                    const spaces = listMatch[1].length;
                    const content = listMatch[2];
                    const currentLevel = Math.floor(spaces / 2);

                    if (!inList) { html += '<ul class="parsed-list">'; inList = true; listLevel = 0; }
                    
                    while (currentLevel > listLevel) { html += '<ul>'; listLevel++; }
                    while (currentLevel < listLevel) { html += '</ul>'; listLevel--; }
                    
                    html += `<li>${content}</li>`;
                    continue;
                } else if (inList) {
                    while (listLevel >= 0) { html += '</ul>'; listLevel--; }
                    inList = false;
                }

                html += `<p class="parsed">${rawLine}</p>`;
            }

            if (inTable) html += '</tbody></table></div>';
            while (listLevel >= 0) { html += '</ul>'; listLevel--; }
            html += '</div>';

            updateTOC(tocItems);
            return html;
        }

        function updateTOC(tocItems) {
            const tocListEl = document.getElementById('tocList');
            if (tocItems.length === 0) {
                tocListEl.innerHTML = '<span style="padding: 8px 14px; display:block; font-size:0.8rem; color:var(--text-muted); font-style:italic;">Tidak ada sub-judul</span>';
                return;
            }

            let tocHTML = '';
            tocItems.forEach(item => {
                tocHTML += `<a href="#${item.id}" onclick="document.getElementById('navDropdown').classList.remove('active')">• ${item.text}</a>`;
            });
            tocListEl.innerHTML = tocHTML;
        }

        // --- MENGGUNAKAN WINDOW.PRINT() UNTUK PDF YANG 100% BERSIH DAN PRESISI ---
        function downloadPDF() {
            document.getElementById('navDropdown').classList.remove('active');
            window.print();
        }

        function buildChart(type, dataStr) {
            const items = dataStr.split(';').map(i => i.trim()).filter(i => i !== '');
            if (items.length === 0) return '';
            
            let maxVal = 0; let totalVal = 0;
            const parsedItems = items.map(item => {
                const parts = item.split(',');
                const label = parts[0] ? parts[0].trim() : 'Label';
                const val = parts[1] ? parseFloat(parts[1].trim()) : 0;
                if(val > maxVal) maxVal = val;
                totalVal += val;
                return { label, val };
            });

            const colors = ['#2563eb', '#475569', '#0ea5e9', '#059669', '#7c3aed', '#d97706', '#db2777', '#4f46e5'];
            let html = `<div class="chart-box"><div class="chart-title">Visualisasi Data (${type})</div><div class="chart-scroll-container">`;

            const dynamicMinWidth = Math.max(400, parsedItems.length * 60);

            if (type === 'batang') {
                html += `<div style="min-width: ${dynamicMinWidth}px;">`;
                parsedItems.forEach((item, idx) => {
                    const width = maxVal > 0 ? (item.val / maxVal * 100) : 0;
                    const bg = colors[idx % colors.length];
                    html += `
                        <div class="chart-row">
                            <div class="chart-label" title="${item.label}">${item.label}</div>
                            <div class="chart-bar-wrap">
                                <div class="chart-bar" style="width: ${width}%; background: ${bg}; color: #ffffff;">${item.val}</div>
                            </div>
                        </div>`;
                });
                html += `</div>`;
            } else if (type === 'lingkaran' || type === 'pie') {
                let conicData = []; let currentPerc = 0; let legends = '';
                let segmentsMeta = [];

                parsedItems.forEach((item, idx) => {
                    const exactPerc = totalVal > 0 ? (item.val / totalVal * 100) : 0;
                    const formattedPerc = exactPerc % 1 === 0 ? exactPerc : exactPerc.toFixed(1);
                    
                    const start = currentPerc;
                    const end = currentPerc + exactPerc;
                    const color = colors[idx % colors.length];
                    
                    conicData.push(`${color} ${start}% ${end}%`);
                    currentPerc = end;

                    segmentsMeta.push({
                        label: item.label,
                        val: item.val,
                        perc: formattedPerc,
                        start: start,
                        end: end
                    });
                    
                    legends += `
                        <div class="pie-legend-card">
                            <span class="color-box" style="background:${color}"></span> 
                            <span>${item.label}: <strong>${item.val}</strong></span>
                        </div>`;
                });

                const chartId = 'pie-' + Math.random().toString(36).substring(2, 9);

                html += `
                    <div class="pie-column-container" style="min-width: 320px;">
                        <div id="${chartId}" 
                             class="pie-chart-large pie-interactive" 
                             style="background: conic-gradient(${conicData.join(', ')})" 
                             data-total-label="Total: ${totalVal}"
                             data-tooltip="Arahkan kursor ke grafik"
                             data-segments='${JSON.stringify(segmentsMeta)}'>
                        </div>
                        <div class="pie-legends-wrapper">
                            <div class="pie-legends-grid">${legends}</div>
                        </div>
                    </div>`;
            } else if (type === 'line') {
                const svgWidth = Math.max(500, parsedItems.length * 80);
                const h = 180; const padY = 30; const padX = 40;
                const graphW = svgWidth - (padX * 2); const graphH = h - (padY * 2);
                
                let points = []; let circlesHtml = []; let labelsHtml = [];
                const stepX = parsedItems.length > 1 ? (graphW / (parsedItems.length - 1)) : (graphW / 2);

                parsedItems.forEach((item, idx) => {
                    const x = padX + (idx * stepX);
                    const y = padY + graphH - (maxVal > 0 ? (item.val / maxVal * graphH) : 0);
                    points.push(`${x},${y}`);
                    circlesHtml += `<circle cx="${x}" cy="${y}" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="2" />`;
                    circlesHtml += `<text x="${x}" y="${y - 10}" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">${item.val}</text>`;
                    labelsHtml += `<text x="${x}" y="${h - 8}" font-size="11" text-anchor="middle" fill="#64748b">${item.label}</text>`;
                });

                html += `<svg viewBox="0 0 ${svgWidth} ${h}" class="line-svg" style="width: ${svgWidth}px;"><polyline points="${points.join(' ')}" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${circlesHtml}${labelsHtml}</svg>`;
            }

            html += `</div></div>`;
            return html;
        }

        document.addEventListener('mousemove', function(e) {
            const chartEl = e.target.closest('.pie-interactive');
            if (!chartEl) {
                document.querySelectorAll('.pie-chart-large.hovered').forEach(el => el.classList.remove('hovered'));
                return;
            }

            const rect = chartEl.getBoundingClientRect();
            const x = e.clientX - (rect.left + rect.width / 2);
            const y = e.clientY - (rect.top + rect.height / 2);
            
            let rad = Math.atan2(y, x);
            let deg = rad * (180 / Math.PI) + 90;
            if (deg < 0) deg += 360;
            
            const percentPos = (deg / 360) * 100;
            
            try {
                const segments = JSON.parse(chartEl.getAttribute('data-segments'));
                let activeSegment = segments.find(seg => percentPos >= seg.start && percentPos <= seg.end);
                if (!activeSegment && segments.length > 0) {
                    activeSegment = segments[segments.length - 1];
                }

                if (activeSegment) {
                    chartEl.setAttribute('data-tooltip', `${activeSegment.label}: ${activeSegment.val} (${activeSegment.perc}%)`);
                    chartEl.classList.add('hovered');
                }
            } catch (err) {}
        });

        document.addEventListener('mouseleave', function(e) {
            const chartEl = e.target.closest('.pie-interactive');
            if (chartEl) {
                chartEl.classList.remove('hovered');
            }
        }, true);

        async function loadArchiveContent() {
            const container = document.getElementById('content-container');
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id) {
                container.innerHTML = '<div class="msg">Galat: ID arsip tidak ditemukan pada URL.</div>';
                return;
            }

            try {
                const response = await fetch(`./archive/${id}.txt`);
                if (!response.ok) throw new Error('Arsip tidak ditemukan atau gagal dimuat.');
                
                const text = await response.text();
                container.innerHTML = parseToHTML(text);
            } catch (error) {
                container.innerHTML = `<div class="msg">Error: ${error.message}</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadArchiveContent);
    </script>
</body>
</html>
