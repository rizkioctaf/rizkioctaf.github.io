<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membaca Artikel Rahasia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Dependencies HANYA dipanggil di mana dibutuhkan -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body id="page-view">

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo" title="Kembali ke Beranda">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                SecureReader
            </a>

            <!-- Dropdown Daftar Isi -->
            <div class="toc-wrapper" id="tocWrapper">
                <button class="toc-btn" id="tocBtn" title="Daftar Isi">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                </button>
                <div class="toc-dropdown" id="tocDropdown">
                    <div class="toc-header">Daftar Isi</div>
                    <div class="toc-list" id="tocList"></div>
                </div>
            </div>
        </div>
    </header>

    <main style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
        <div id="passwordPrompt">
            <h2>Buka Artikel</h2>
            <p id="articleTargetName">Masukkan kata sandi rahasia.</p>
            <form id="decryptForm">
                <input type="password" id="readPassword" class="pw-input" placeholder="Kata sandi..." required autofocus>
                <button type="submit" class="btn-unlock" id="btnUnlock">Buka Gembok</button>
                <div id="errorMsg">Kata sandi salah atau file tidak ditemukan!</div>
            </form>
        </div>

        <div id="decryptedContent" class="article-body"></div>
    </main>

    <!-- Panggil File JS Utama -->
    <script src="script.js"></script>
</body>
</html>
