<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Mencegah zoom layar otomatis saat pengguna mengetik kata sandi di ponsel -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Membaca Dokumen Rahasia - SecureReader</title>
    
    <!-- Konfigurasi PWA & Ikon (Menggunakan logo.svg yang valid) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FCFCFC">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="logo.svg">

    <!-- Optimasi Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- =====================================================================
         PEMANGGILAN STYLESHEET MODULAR
         Memuat seluruh lapisan CSS termasuk article.css untuk tipografi bacaan
         ===================================================================== -->
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/article.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    
    <!-- =====================================================================
         LIBRARY EKSTERNAL (WAJIB UNTUK HALAMAN BACA)
         1. CryptoJS: Mesin dekripsi PBKDF2 + AES-256-CBC di sisi klien
         2. Chart.js: Mesin rendering grafik statistik interaktif monokrom
         ===================================================================== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<!-- ID "page-view" mengaktifkan proteksi anti-seleksi teks (user-select: none) di CSS -->
<body id="page-view">

    <noscript>
        <div style="background: #18181B; color: #FAFAFA; padding: 20px; text-align: center; font-family: sans-serif; z-index: 9999; position: relative;">
            <strong>Peringatan Keamanan:</strong> Dekripsi file rahasia membutuhkan JavaScript. Harap aktifkan JavaScript Anda.
        </div>
    </noscript>

    <!-- Wadah Notifikasi Pop-up (Toast) -->
    <div id="toast-container" aria-live="polite"></div>

    <!-- =====================================================================
         HEADER NAVIGASI BACA
         Otomatis bersembunyi saat menggulir ke bawah agar fokus membaca maksimal,
         dan memiliki bilah progres baca tipis di bagian tepi bawahnya
         ===================================================================== -->
    <header>
        <div class="nav-container">
            
            <!-- Tombol kembali ke halaman daftar artikel (Beranda) -->
            <a href="index.html" class="logo" aria-label="Kembali ke Beranda" title="Kembali ke Beranda">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                SecureReader
            </a>
            
            <!-- Menu Daftar Isi (Table of Contents) Otomatis.
                 Tersembunyi di awal, hanya muncul setelah artikel terbuka dan memiliki sub-judul (H2) -->
            <div class="toc-wrapper" id="tocWrapper">
                <!-- Tombol pemicu buka/tutup dropdown daftar isi -->
                <button type="button" class="toc-btn" id="tocBtn" aria-label="Buka Daftar Isi" aria-expanded="false" aria-controls="tocDropdown" title="Daftar Isi">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                </button>
                
                <!-- Panel dropdown melayang berisi tautan navigasi cepat antar bab -->
                <div class="toc-dropdown" id="tocDropdown" role="menu">
                    <div class="toc-header">Daftar Isi</div>
                    <div class="toc-list" id="tocList"></div>
                </div>
            </div>

        </div>
    </header>

    <!-- =====================================================================
         AREA UTAMA DOKUMEN
         Memiliki 3 fase tampilan: Loader -> Form Kata Sandi -> Konten Artikel
         ===================================================================== -->
    <main class="main-container">
        
        <!-- FASE 1: LAYAR LOADING AWAL
             Menutupi layar sejenak saat sistem memeriksa sesi auto-login 24 jam di localStorage -->
        <div class="fullscreen-loader" id="mainLoader" role="status">
            <div class="spinner" aria-hidden="true"></div>
            <p>Memverifikasi akses keamanan...</p>
        </div>

        <!-- FASE 2: FORMULIR PEMBUKA GEMBOK (KATA SANDI)
             Muncul jika sesi auto-login tidak ditemukan atau sudah kedaluwarsa -->
        <section id="passwordPrompt" aria-labelledby="promptTitle">
            <h2 id="promptTitle">Buka Dokumen Rahasia</h2>
            
            <!-- Menampilkan ID file dokumen yang sedang diakses -->
            <p id="articleTargetName">Memuat ID...</p>
            
            <form id="decryptForm">
                <!-- Input kata sandi (Otomatis dibungkus tombol intip sandi oleh initPasswordToggles() di dom.js) -->
                <input type="password" id="readPassword" class="pw-input" placeholder="Masukkan kata sandi..." required autofocus autocomplete="off" spellcheck="false" aria-label="Kata Sandi Artikel">
                
                <!-- Tombol eksekusi dekripsi -->
                <button type="submit" class="btn-unlock" id="btnUnlock">Buka Gembok</button>
            </form>
        </section>

        <!-- FASE 3: WADAH ARTIKEL HASIL DEKRIPSI
             Dirender dalam lebar optimal 68 karakter per baris agar nyaman dibaca lama -->
        <article id="decryptedContent" class="article-body"></article>
        
    </main>

    <!-- Memanggil modul logika khusus halaman Baca -->
    <script type="module" src="assets/js/pages/view.js"></script>
</body>
</html>
